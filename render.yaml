services:
  - type: web
    name: theraops-backend
    runtime: python
    buildCommand: pip install -r theraops_backend/requirements.txt
    startCommand: uvicorn theraops_backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: INCIDENT_MEMORY_FILE
        value: /data/incidents.json
    disk:
      name: frieren-memory
      mountPath: /data
      sizeGB: 1
